  "14193", "14199",                                                # Grunewald, Schmargendorf
  "10551", "10553", "10555", "10557", "10559", "10785", "10787",  # Moabit, Hansaviertel, Tiergarten
  "13347", "13351", "13353", "13357",                             # Wedding, Gesundbrunnen
  "10115", "10117", "10178", "10179",                             # Mitte
  "10777", "10779", "10781", "10783", "10789", "10823", "10825", "10827", "10829",  # Schöneberg
