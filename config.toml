# homefind configuration. Anything left out falls back to the defaults in
# homefind/config.py. After changing [search] or [area], run
#   python3 -m homefind --recheck
# to re-apply the rules to everything already stored.

[search]
# A flat that fails any of these rules is stored, so it isn't loaded again, but never shown;
# `python3 -m homefind --rejected 50` lists the latest, with why. One you applied to stays on
# Applied, and on the family page, even if it would fail now.
max_warm_rent = 982          # € per month incl. Nebenkosten + Heizung: anything over it is dropped
# Streets worth paying more for: their own budget, and the score goes as much easier
# on their price (1200 € there would score like 982 € elsewhere). Matched on the address,
# or the title when there's none ("Wohnung am Ku'damm", not "nahe Ku'damm"); spellings
# like Kantstr. / Kudamm are fine. The searches go up to the highest budget named here.
street_max_warm_rent = {}    # e.g. { "Kurfürstendamm" = 1200 }
min_size_sqm = 25            # drops micro-apartments / co-living rooms
min_rooms = 1                # fewer are dropped
wanted_rooms = 2             # fewer (1, 1.5): a tier down (Good, not Match), with a heads-up note
have_wbs = false             # true = keep listings that need a Wohnberechtigungsschein
coop_member = false          # true = keep co-op offers marked "members only"
reject_furnished = true      # furnished in Berlin ≈ temporary + overpriced
include_senior_housing = false  # "Wohnen ab 50/60", Seniorenwohnungen
extra_costs_per_sqm = 2.5    # to estimate warm rent when only cold rent is given
suspicious_below_eur_sqm = 10.0  # warm €/m²; new leases here are ~15–25 €/m²
scam_threshold = 3           # scam points at which a listing is dropped (see homefind/rules.py)

[area]
# Drawn on the district map, 11 Nov 2026, by neighbourhood (Ortsteil) in red and orange, and
# taken by postcode: one at least half in the red is in zip_codes, else one at least half in
# the red and orange together is in edge_zip_codes. In the red, flats with wanted_rooms (2) or
# more are Matches and ones with fewer are Good; in the orange, they're Good and Sufficient
# (see tier in homefind/rules.py). Every other postcode is outside the area: those never
# show. Postcodes don't follow neighbourhood borders exactly.
zip_codes = [  # red
  "10585", "10587", "10589", "10623", "10625", "10627", "10629", "14057", "14059",  # Charlottenburg
  "14050", "14052", "14053", "14055",                                               # Westend
  "10707", "10709", "10711", "10713", "10715", "10717", "10719", "10789", "14197",  # Wilmersdorf, Halensee
  "14199",                                                                          # Schmargendorf
  "10551", "10553", "10555", "10557", "10559", "10785", "10787",  # Moabit, Hansaviertel, Tiergarten
  "13347", "13349", "13351", "13353",                             # Wedding
]
edge_zip_codes = [  # orange
  "13627", "13629",                                               # Charlottenburg-Nord, Siemensstadt
  "13403", "13405", "13407", "13409", "13505", "13507", "13509",  # Reinickendorf, Tegel
  "13355", "13357", "13359",                                      # Gesundbrunnen
  "13187", "13189",                                               # Pankow
  "10115", "10117", "10119", "10178", "10179",                    # Mitte
  "10961", "10963", "10967", "10969", "10997", "10999",           # Kreuzberg
  "10777", "10779", "10781", "10783", "10823", "10825", "10827", "10829", "12157",  # Schöneberg
  "12159", "12161",                                               # Friedenau
  "14193",                                                        # Grunewald
]
# Only for listings without a postcode: the portal's neighbourhood label (or else a
# Berlin neighbourhood named in the title, for "outside the area").
names = [
  "Charlottenburg", "Westend", "Halensee", "Wilmersdorf", "Schmargendorf", "Moabit", "Hansaviertel", "Tiergarten",
  "Wedding",
]
edge_names = [
  "Charlottenburg-Nord", "Siemensstadt", "Tegel", "Reinickendorf", "Gesundbrunnen", "Pankow", "Mitte", "Kreuzberg",
  "Schöneberg", "Friedenau", "Grunewald",
]
exclude_names = []           # names to ignore in a label, if they'd match one of the above by mistake

[bonus]
# Extra points in the score for where a flat is; they never make or break a match.
# The points themselves are in homefind/rating.py.
# The old area, the matches until 7 Nov 2026: Charlottenburg, Westend, Halensee, Wilmersdorf.
old_area = [
  "10585", "10587", "10589", "10623", "10625", "10627", "10629",  # Charlottenburg
  "14050", "14052", "14053", "14055", "14057", "14059",           # Westend
  "10707", "10709", "10711", "10713", "10715", "10717", "10719", "10777", "14197",  # Halensee, Wilmersdorf
]
# Streets you'd like to live on, matched like street_max_warm_rent's (from the address,
# or the title when there's none: "Wohnung am Savignyplatz").
streets = [
  "Kurfürstendamm", "Kantstraße", "Otto-Suhr-Allee", "Wilmersdorfer Straße", "Bismarckstraße", "Kaiserdamm",
  "Savignyplatz", "Grolmanstraße", "Knesebeckstraße", "Bleibtreustraße", "Carmerstraße", "Mommsenstraße",
  "Schloßstraße",   # Steglitz's shopping street, and Charlottenburg's to the palace
  "Turmstraße",     # Moabit
  "Rheinstraße", "Hauptstraße",  # Friedenau, Schöneberg
]
# Places you go every day, each worth points by how long it takes to get there door to door, on foot or
# by public transport, whichever is quicker (transit.py asks BVG's planner; it's on the cards too): all of
# them up to 15 minutes, none from 40. Put them in config.local.toml, which stays off GitHub, as:
# [bonus] daily = [{ name = "work", lat = 52.5219, lon = 13.4132 }]
# (right-click the place in Google Maps; the first line is lat, lon). Each can also have points = 12, the
# most it's worth (9 if not set), so one counts for more than another; pill = "blue" or "light-blue",
# its chip's colour on the cards; and score = false: on the cards only, no points.

[run]
request_delay_seconds = 2.0  # minimum gap between two requests to the same site
web_port = 8765              # web UI at http://localhost:8765 while --loop / --serve runs; 0 = off
highlight_sources = ["immoscout"]  # their cards get a coloured outline and badge in the web UI

[notify]
# ntfy.sh: install the ntfy app (Android/iOS) or open https://ntfy.sh/app,
# subscribe to a topic, then run: python3 -m homefind --test-notify
# Anyone who knows the topic's name can read your pushes and send you their own, so
# make it unguessable and set it in config.local.toml, which stays off GitHub:
#   [notify]
#   ntfy_topic = "homefind-..."
ntfy_topic = ""
# Telegram instead of / as well as ntfy: create a bot with @BotFather. Its token
# belongs in config.local.toml too.
telegram_bot_token = ""
telegram_chat_id = ""

[apply]
# ✉ Apply on ImmoScout24 and Immowelt cards, and the Full auto / Autofill / Autofill + send
# switches in the web UI's header, through the Firefox helper (see the README). What goes in
# the form is in apply.toml, which stays off GitHub.
max_per_day = 10             # Full auto sends at most this many a day (counting ✉ Apply's sends)

[casa]
# The read-only family page, in Brazilian Portuguese (see the README). It's uploaded to this
# server as plain files; casa-setup.sh gets the server ready, once.
host = "alt"                            # ssh host, as in ~/.ssh/config
remote_dir = "/var/www/casa.admou.se"   # folder nginx serves
url = "https://casa.admou.se"

# every_minutes = how often --loop checks each source (kept hourly to stay well
# clear of rate limits, except ImmoScout). A source that gets blocked pauses itself
# (2x, 4x, ... its interval, max 6 h).
# Ads taken offline are moved to Hidden: each check also looks up check_per_run
# older ads (default 5, wggesucht 2; inberlinwohnen's on the landlord's page), and
# inberlinwohnen goes through all its pages every sweep_every_hours (default 12).
[sources.inberlinwohnen]     # all 6 municipal landlords, no scams, often WBS
every_minutes = 60
[sources.immoscout]          # ImmoScout24 via its app API
every_minutes = 15           # most matches come from here; one request per check when nothing's new
check_per_run = 2            # offline lookups per check (4 checks an hour, so up to 8 an hour)
geocodes = ["1276003001"]   # all of Berlin; [area] sorts them
[sources.kleinanzeigen]
every_minutes = 60
locations = [{ slug = "berlin", id = 3331 }]  # all of Berlin; [area] sorts them
max_pages = 4                # 27 ads a page; stops at the first page with nothing new
[sources.wggesucht]
every_minutes = 60
districts = []               # all of Berlin (was [126, 192, 85083]: Charlottenburg, Wilmersdorf, Halensee)
[sources.immowelt]           # partial coverage, see homefind/sources/immowelt.py: only Charlottenburg,
                             # Westend, Halensee and Wilmersdorf up to 900 € cold (no landing pages for more)
every_minutes = 60
[sources.charlotte1907]      # Charlottenburger Baugenossenschaft (co-op)
every_minutes = 60
[sources.watch]              # the co-op pages below
every_minutes = 60

# Housing co-ops with flats in Charlottenburg-Wilmersdorf that have no parser:
# you get a notification when new lines of text appear on their offers page.
# Most co-ops need membership (shares of a few hundred to a few thousand €)
# and some have closed new memberships; check each site.
[[watch]]
name = "Baugenossenschaft Steglitz"
url = "https://gbst.de/wohnungssuche/"
[[watch]]
name = "EVM Berlin"
url = "https://www.evmberlin.de/wohnungssuche/"
[[watch]]
name = "Märkische Baugenossenschaft"
url = "https://www.mb-eg.de/wohnungssuche"
[[watch]]
name = "1892"
url = "https://1892.de/wohnungssuche/"
[[watch]]
name = "Beamten-Wohnungs-Verein"
url = "https://www.bwv-berlin.de/wohnungsangebote.html"
[[watch]]
name = "Märkische Scholle"
url = "https://www.maerkische-scholle.de/wohnungsangebote.html"
[[watch]]
name = "Wohnungsbau-Verein Neukölln"
url = "https://www.wbv-neukoelln.de/aktuelles/wohnungsangebote.html"
