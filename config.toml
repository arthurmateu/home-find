# homefind configuration. Anything left out falls back to the defaults in
# homefind/config.py. After changing [search] or [area], run
#   python3 -m homefind --recheck
# to re-apply the rules to everything already stored.

[search]
max_warm_rent = 982          # € per month incl. Nebenkosten + Heizung: a match up to this
# Over budget, a flat still shows under Rejected → "Over budget" up to this warm rent,
# the most you'd pay; pricier ones are dropped unseen ("over_cap" in drop_reasons).
stretch_warm_rent = 1200
# Streets worth paying more for: their own budget, and the score goes as much easier
# on their price (1200 € there scores like 982 € elsewhere). Matched on the address,
# or the title when there's none ("Wohnung am Ku'damm", not "nahe Ku'damm"); spellings
# like Kantstr. / Kudamm are fine.
street_max_warm_rent = { "Kurfürstendamm" = 1200, "Kantstraße" = 1200 }
# Streets worth stretching for: flats there over their budget, up to this warm rent,
# show under Rejected → "Kurfürstendamm (warm ≤ 1500 €)". Searches cover the whole
# area, so they go up to the highest rent named here; elsewhere, flats over
# stretch_warm_rent are dropped unseen ("over_cap" in drop_reasons).
street_stretch_warm_rent = { "Kurfürstendamm" = 1500 }
near_miss_cold_rent = 0      # with stretch_warm_rent = 0: also load flats with cold rent up to this; if
                             # warm is over budget they show under Rejected → "Near miss", whatever it is
min_size_sqm = 25            # drops micro-apartments / co-living rooms
min_rooms = 1                # fewer show under Rejected → "Too few rooms"
wanted_rooms = 2             # fewer (1, 1.5) still match, with a heads-up note on the card and in the push
have_wbs = false             # true = keep listings that need a Wohnberechtigungsschein
                             # (with it false, also take "wbs" out of drop_reasons to see them under Rejected)
coop_member = false          # true = keep co-op offers marked "members only"
reject_furnished = true      # furnished in Berlin ≈ temporary + overpriced
include_senior_housing = false  # "Wohnen ab 50/60", Seniorenwohnungen
# Rejected for one of these reasons = not shown anywhere (not even under Rejected).
# Codes: near_miss stretch budget edge over_cap no_rent size rooms swap wanted not_flat wg
#        temporary furnished wbs members senior scam photos district area avoid
# over_cap: over stretch_warm_rent (or the street's own stretch). avoid: outside the
# area and its edge (see [area]). area: no idea where it is.
drop_reasons = ["wg", "senior", "swap", "avoid", "wbs", "over_cap"]
extra_costs_per_sqm = 2.5    # to estimate warm rent when only cold rent is given
suspicious_below_eur_sqm = 10.0  # warm €/m²; new leases here are ~15–25 €/m²
scam_threshold = 3           # scam points at which a listing is dropped (see homefind/rules.py)

[area]
