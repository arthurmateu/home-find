  "13403", "13405", "13349", "13355", "13359",                    # Reinickendorf, Tegel, north Wedding, Gesundbrunnen
  "13187", "13189", "10405", "10435", "10437", "10439", "10119",  # Pankow, Prenzlauer Berg, Mitte (north-east)
