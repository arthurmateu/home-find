# homefind configuration. Anything left out falls back to the defaults in
# homefind/config.py. After changing [search] or [area], run
#   python3 -m homefind --recheck
# to re-apply the rules to everything already stored.

[search]
max_warm_rent = 1000         # € per month incl. Nebenkosten + Heizung
near_miss_cold_rent = 1000   # also load flats with cold rent up to this; if warm is over budget they
                             # show under Rejected → "Near miss". 0 = only fetch within max_warm_rent.
min_size_sqm = 25            # drops micro-apartments / co-living rooms
min_rooms = 1
have_wbs = false             # true = keep listings that need a Wohnberechtigungsschein
                             # (with it false, also take "wbs" out of drop_reasons to see them under Rejected)
coop_member = false          # true = keep co-op offers marked "members only"
reject_furnished = true      # furnished in Berlin ≈ temporary + overpriced
include_senior_housing = false  # "Wohnen ab 50/60", Seniorenwohnungen
# Rejected for one of these reasons = not shown anywhere (not even under Rejected).
# Codes: near_miss budget no_rent size rooms swap wanted not_flat wg temporary
#        furnished wbs members senior scam photos district area avoid
drop_reasons = ["wg", "senior", "swap", "avoid", "wbs"]
extra_costs_per_sqm = 2.5    # to estimate warm rent when only cold rent is given
suspicious_below_eur_sqm = 10.0  # warm €/m²; new leases here are ~15–25 €/m²
scam_threshold = 3           # scam points at which a listing is dropped (see homefind/rules.py)

[area]
# A listing matches if its postcode is listed here. Only listings without a
# postcode fall back to the portal's neighbourhood label (names / exclude_names).
# Postcodes don't follow district borders exactly: 14197 and 10777 are partly
# Friedenau / Schöneberg.
zip_codes = [
  "10585", "10587", "10589", "10623", "10625", "10627", "10629",  # Charlottenburg
  "14050", "14052", "14053", "14055", "14057", "14059",           # Westend (+ west Charlottenburg)
  "10709", "10711",                                                # Halensee
  "10707", "10713", "10715", "10717", "10719", "10777", "14197",  # Wilmersdorf
]
names = ["Charlottenburg", "Westend", "Halensee", "Wilmersdorf"]
exclude_names = ["Charlottenburg-Nord"]
# Never interesting, not even under Rejected → Outside area: former East Berlin,
# Spandau and Neukölln (reason code "avoid", dropped via drop_reasons above). Postcodes
# that straddle a border, like 13629 (Siemensstadt / Charlottenburg-Nord), are
# left out, so those still show under "Outside area".
avoid_zip_codes = [
  "10115", "10117", "10119", "10178", "10179",                    # Mitte (the old East part)
  "10243", "10245", "10247", "10249",                             # Friedrichshain
  "10405", "10407", "10409", "10435", "10437", "10439",           # Prenzlauer Berg
  "13086", "13088", "13089", "13125", "13127", "13129",           # Weißensee, Heinersdorf, Buch, Karow, ...
  "13156", "13158", "13159", "13187", "13189",                    # Pankow, Niederschönhausen, Rosenthal
  "10315", "10317", "10318", "10319", "10365", "10367", "10369",  # Lichtenberg, Friedrichsfelde, Karlshorst
  "13051", "13053", "13055", "13057", "13059",                    # Hohenschönhausen
  "12619", "12621", "12623", "12627", "12629",                    # Hellersdorf, Kaulsdorf, Mahlsdorf
  "12679", "12681", "12683", "12685", "12687", "12689",           # Marzahn, Biesdorf
  "12435", "12437", "12439", "12459", "12487", "12489",           # Treptow, Schöneweide, Adlershof
  "12524", "12526", "12527", "12555", "12557", "12559", "12587", "12589",  # Köpenick & around
  "13581", "13583", "13585", "13587", "13589", "13591", "13593",  # Spandau
  "13595", "13597", "13599", "14089",                             # Spandau, Haselhorst, Kladow, Gatow
  "12043", "12045", "12047", "12049", "12051", "12053", "12055", "12057", "12059",  # Neukölln
  "12347", "12349", "12351", "12353", "12355", "12357", "12359",  # Britz, Buckow, Gropiusstadt, Rudow
]
# Only for listings without a postcode (portal label, or a place in the title).
avoid_names = [
  "Friedrichshain", "Prenzlauer Berg", "Pankow", "Weißensee", "Weissensee", "Heinersdorf",
  "Niederschönhausen", "Lichtenberg", "Friedrichsfelde", "Karlshorst", "Rummelsburg", "Hohenschönhausen",
  "Marzahn", "Hellersdorf", "Biesdorf", "Kaulsdorf", "Mahlsdorf", "Treptow", "Köpenick", "Adlershof",
  "Johannisthal", "Schöneweide", "Oberschöneweide", "Niederschöneweide", "Baumschulenweg", "Plänterwald",
  "Altglienicke", "Grünau", "Friedrichshagen",
  "Spandau", "Siemensstadt", "Haselhorst", "Hakenfelde", "Staaken", "Wilhelmstadt", "Kladow", "Gatow",
  "Neukölln", "Neukoelln", "Britz", "Buckow", "Gropiusstadt", "Rudow",
]

[run]
request_delay_seconds = 2.0  # minimum gap between two requests to the same site
web_port = 8765              # web UI at http://localhost:8765 while --loop / --serve runs; 0 = off

[notify]
# ntfy.sh: install the ntfy app (Android/iOS) or open https://ntfy.sh/app,
# subscribe to this topic, then run: python3 -m homefind --test-notify
# Anyone who knows the topic name can read it, so keep it unguessable.
ntfy_topic = "homefind-2zop46awwn3mb5"
# Telegram instead of / as well as ntfy: create a bot with @BotFather.
telegram_bot_token = ""
telegram_chat_id = ""

# every_minutes = how often --loop checks each source (kept hourly to stay well
# clear of rate limits). A source that gets blocked pauses itself
# (2x, 4x, ... its interval, max 6 h).
[sources.inberlinwohnen]     # all 6 municipal landlords, no scams, often WBS
every_minutes = 60
[sources.immoscout]          # ImmoScout24 via its app API
every_minutes = 60
geocodes = ["1276003001011", "1276003001076"]  # Charlottenburg (+Westend), Wilmersdorf (+Halensee)
[sources.kleinanzeigen]
every_minutes = 60
locations = [
  { slug = "charlottenburg", id = 3332 },
  { slug = "westend", id = 25905 },
  { slug = "wilmersdorf", id = 3532 },   # includes Halensee
]
[sources.wggesucht]
every_minutes = 60
districts = [126, 192, 85083]          # Charlottenburg, Wilmersdorf, Halensee
[sources.immowelt]           # partial coverage, see homefind/sources/immowelt.py
every_minutes = 60
[sources.charlotte1907]      # Charlottenburger Baugenossenschaft (co-op)
every_minutes = 60
[sources.watch]              # the co-op pages below
every_minutes = 60

# Housing co-ops with flats in Charlottenburg-Wilmersdorf that have no parser:
# you get a notification when new lines of text appear on their offers page.
# Most co-ops need membership (shares of a few hundred to a few thousand €)
# and some have closed new memberships; check each site.
[[watch]]
name = "Baugenossenschaft Steglitz"
url = "https://gbst.de/wohnungssuche/"
[[watch]]
name = "EVM Berlin"
url = "https://www.evmberlin.de/wohnungssuche/"
[[watch]]
name = "Märkische Baugenossenschaft"
url = "https://www.mb-eg.de/wohnungssuche"
[[watch]]
name = "1892"
url = "https://1892.de/wohnungssuche/"
[[watch]]
name = "Beamten-Wohnungs-Verein"
url = "https://www.bwv-berlin.de/wohnungsangebote.html"
[[watch]]
name = "Märkische Scholle"
url = "https://www.maerkische-scholle.de/wohnungsangebote.html"
[[watch]]
name = "Wohnungsbau-Verein Neukölln"
url = "https://www.wbv-neukoelln.de/aktuelles/wohnungsangebote.html"
