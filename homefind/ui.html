<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Flat hunt</title>
<link rel="icon" id="favicon">
<style>
:root {
  --bg: #f6f6f3; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de; --chip: #f0f0ec;
  --accent: #1f6f5c; --accent-ink: #fff; --warn: #a2560c; --warn-bg: #fdf1e3; --bad: #a3322a; --bad-bg: #fbeceb;
  --fav: #6e56cf; --fav-ink: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --card: #1e1e1c; --ink: #ececE8; --muted: #9a9a93; --line: #33332f; --chip: #2a2a27;
    --accent: #6fc2a9; --accent-ink: #0d2a22; --warn: #f0b36b; --warn-bg: #3a2a17; --bad: #f19a92; --bad-bg: #3a1d1b;
    --fav: #b4a5ff; --fav-ink: #1f1640;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body.noscroll { overflow: hidden; }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
       backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; padding-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
       padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.n { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 2px; }
/* Filters: one dropdown each; the open menu lists every choice with its count. */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 16px 10px; }
.dd { position: relative; }
.dd-btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px;
          border-radius: 8px; padding: 4px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; max-width: 280px; }
.dd-btn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dd-label { color: var(--muted); font-weight: 600; }
.dd-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caret { color: var(--muted); font-size: 10px; }
.dd-menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 10; min-width: 220px; max-height: min(60vh, 420px); overflow: auto;
           display: grid; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           box-shadow: 0 8px 28px rgba(0, 0, 0, .25); }
.dd-opt { appearance: none; border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; text-align: left;
          position: relative; display: flex; gap: 16px; padding: 6px 10px 6px 28px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.dd-opt:hover, .dd-opt:focus-visible { background: var(--chip); }
.dd-opt .n { margin-left: auto; }
.dd-opt[aria-checked="true"]::before { content: "✓"; position: absolute; left: 10px; color: var(--accent); font-weight: 700; }
.dd-opt[data-any] { border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; margin-bottom: 2px; }
.filter-sum { font-size: 13px; color: var(--muted); }
@media (max-width: 600px) {  /* on a phone the header would take a third of the screen: let it scroll away */
  .top { position: static; }
  .filters { gap: 6px; }
  .dd-btn { padding: 4px 8px; gap: 4px; }
}
.linkish { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }

main { padding-top: 18px; padding-bottom: 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--chip); }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.nophoto { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 0;
       background: rgba(0, 0, 0, .55); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.nav.prev { left: 8px; } .nav.next { right: 8px; }
@media (hover: hover) { .nav { opacity: 0; transition: opacity .15s; } .media:hover .nav, .nav:focus-visible { opacity: 1; } }
.counter { position: absolute; right: 8px; bottom: 8px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px;
           padding: 2px 8px; border-radius: 99px; pointer-events: none; }
.badges { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--card); color: var(--ink); }
.badge.new { background: var(--accent); color: var(--accent-ink); }
.badge.gone { background: var(--ink); color: var(--bg); }
.badge.fav { background: var(--fav); color: var(--fav-ink); }
.card.fav { border-color: var(--fav); box-shadow: 0 0 0 1px var(--fav); background: color-mix(in srgb, var(--fav) 6%, var(--card)); }
.card.gone .photo { filter: grayscale(1); }
.score { position: absolute; right: 8px; top: 8px; min-width: 38px; padding: 3px 9px; border-radius: 99px; font-weight: 700;
         font-size: 14px; text-align: center; color: #fff; background: #6b6b66; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.score.great { background: #1b7a4c; } .score.good { background: #2a67a8; } .score.ok { background: #8a6a14; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sort { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sort select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
               border-radius: 8px; padding: 5px 8px; }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; }
.why { list-style: none; margin: 0; padding: 6px 10px; border-left: 3px solid var(--line); font-size: 13px; display: grid; gap: 2px; }
.why .pts { display: inline-block; min-width: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.why .plus { color: var(--accent); } .why .minus { color: var(--bad); } .why .zero { color: var(--muted); }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.price { font-weight: 650; font-size: 16px; }
.card.rejected .price { color: var(--muted); }
.title { color: var(--ink); text-decoration: none; overflow-wrap: anywhere;
         display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; } .title:hover { text-decoration: underline; }
.meta { position: relative; color: var(--muted); font-size: 13px; }
/* The map pops up above the meta line on hover or keyboard focus, or stays up after a click (touch). */
.loc-btn { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--ink); cursor: pointer;
           text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.map-pop { display: block; position: absolute; left: 0; right: 0; bottom: 100%; z-index: 3; padding-bottom: 6px;
           visibility: hidden; opacity: 0; transition: opacity .12s, visibility 0s .12s; }
.loc-btn:hover + .map-pop, .loc-btn:focus-visible + .map-pop, .map-pop:hover, .map-pop:focus-within, .loc.open .map-pop {
  visibility: visible; opacity: 1; transition: opacity .12s .1s, visibility 0s .1s; }
.map-pop .minimap { box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
.minimap { position: relative; flex: none; height: 128px; border-radius: 8px; overflow: hidden; background: var(--chip); border: 1px solid var(--line); }
.minimap .tile { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none; user-select: none; }
.minimap .open { position: absolute; inset: 0; z-index: 1; }
.minimap .pin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
                background: #e5484d; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .5); pointer-events: none; }
.minimap .zone { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%;
                 background: rgba(229, 72, 77, .14); border: 2px dashed #e5484d; pointer-events: none; }
.minimap .credit { position: absolute; right: 0; bottom: 0; z-index: 2; font-size: 10px; line-height: 1.5; padding: 0 5px;
                   border-top-left-radius: 4px; background: rgba(255, 255, 255, .75); color: #333; text-decoration: none; }
@media (prefers-color-scheme: dark) { .minimap .credit { background: rgba(0, 0, 0, .6); color: #bbb; } }
.reasons { margin: 0; color: var(--bad); background: var(--bad-bg); padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.offline { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.desc-toggle { align-self: flex-start; appearance: none; border: 0; background: none; color: var(--accent); font: inherit;
               font-size: 14px; font-weight: 600; padding: 2px 0; cursor: pointer; }
.desc { white-space: pre-line; font-size: 14px; max-height: 360px; overflow: auto; border-left: 3px solid var(--line); padding-left: 10px; }
.desc-none { margin: 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px;
       padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.more { text-align: center; margin-top: 20px; }

.banner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--accent); color: var(--accent-ink);
          padding: 6px 6px 6px 16px; border-radius: 99px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
.banner .btn { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 99px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg);
         padding: 6px 6px 6px 16px; border-radius: 10px; display: flex; gap: 10px; align-items: center; min-height: 40px; }
.toast .btn { color: var(--bg); text-decoration: underline; }
.error { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--bad); color: #fff; padding: 8px 16px; font-size: 14px; }

.lb { position: fixed; inset: 0; z-index: 40; background: rgba(10, 10, 10, .95); display: grid;
      grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; }
.lb-fig { grid-row: 1; grid-column: 2; margin: 0; height: 100%; min-height: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px; padding: 16px 0 4px; }
#lb-img { max-width: 100%; max-height: calc(100% - 30px); object-fit: contain; }
#lb-cap { color: #ddd; font-size: 14px; text-align: center; }
.lb-nav { grid-row: 1; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff;
          font-size: 30px; line-height: 1; cursor: pointer; justify-self: center; }
.lb-nav:hover, .lb-close:hover { background: rgba(255, 255, 255, .25); }
.lb-nav.prev { grid-column: 1; } .lb-nav.next { grid-column: 3; }
.lb-close { position: absolute; top: 10px; right: 12px; width: 42px; height: 42px; border: 0; border-radius: 50%;
            background: rgba(255, 255, 255, .14); color: #fff; font-size: 20px; cursor: pointer; z-index: 1; }
.lb-thumbs { grid-row: 2; grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 14px; justify-content: safe center; }
.lb-thumb { flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; opacity: .55; }
.lb-thumb[aria-current="true"] { border-color: #fff; opacity: 1; }
.lb-thumb img { display: block; width: 76px; height: 57px; object-fit: cover; border-radius: 4px; }
@media (max-width: 600px) {
  .lb { grid-template-columns: 0 minmax(0, 1fr) 0; }
  .lb-nav { position: absolute; top: 45%; width: 40px; height: 40px; font-size: 24px; }
  .lb-nav.prev { left: 6px; } .lb-nav.next { right: 6px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap head">
    <div>
      <h1>Flat hunt</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="controls">
      <label class="sort">Sort
        <select id="sort">
          <option value="score">Best first</option>
          <option value="newest">Newest</option>
          <option value="cheapest">Cheapest</option>
          <option value="largest">Largest</option>
        </select>
      </label>
      <button class="btn" id="toggle-desc" aria-pressed="false">Expand descriptions</button>
    </div>
  </div>
  <nav class="wrap tabs" role="tablist" id="tabs"></nav>
  <div class="wrap filters" id="filters" hidden></div>
</header>

<div class="banner" id="banner" hidden><span id="banner-text"></span><button class="btn small" id="banner-show">Show</button></div>

<main class="wrap">
  <p class="empty" id="empty" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn" id="more" hidden></button></div>
</main>

<div class="toast" id="toast" hidden role="status"><span id="toast-text"></span><button class="btn small ghost" id="toast-undo" hidden>Undo</button></div>
<div class="error" id="error" hidden role="alert"></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photos">
  <button class="lb-close" id="lb-close" aria-label="Close photos">✕</button>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <figure class="lb-fig" id="lb-fig"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-nav next" id="lb-next" aria-label="Next photo">›</button>
  <div class="lb-thumbs" id="lb-thumbs"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const showError = (msg) => { $("error").textContent = "Something went wrong: " + msg; $("error").hidden = false; };
window.addEventListener("error", (e) => showError(e.message));
window.addEventListener("unhandledrejection", (e) => showError(String(e.reason)));

// Per-browser conveniences only; saved/hidden live in the database.
const prefs = {
  get(k, d) { try { const v = localStorage.getItem("homefind:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("homefind:" + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

const PAGE = 48;
const BROKEN = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#8883"/>' +
  '<text x="50%" y="50%" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#888">Photo unavailable</text></svg>');
const TABS = [
  ["matches", "Matches", (l) => l.ok && !l.status],
  ["saved", "Saved", (l) => l.status === "saved"],
  ["rejected", "Rejected", (l) => !l.ok && !l.status],
  ["hidden", "Hidden", (l) => l.status === "hidden"],
];
const SOURCES = { immoscout: "ImmoScout24", wggesucht: "WG-Gesucht", kleinanzeigen: "Kleinanzeigen", immowelt: "Immowelt" };
// Ads taken offline get one of these tags (rejected ones are deleted instead; see Store.mark_gone in store.py).
const GONE = { deactivated: "Deactivated", deleted: "Deleted" };
const EMPTY = {
  matches: "No matches right now. New ones show up here and on your phone.",
  saved: "Nothing saved yet. Use ☆ Save on a listing to keep it here.",
  rejected: "Nothing rejected in the area.",
  hidden: "Nothing hidden.",
};

// Tolerate data from an older homefind process (fields added later default sensibly).
function normalize(d) {
  d.highlight ??= [];
  for (const l of d.listings) {
    l.why ??= []; l.score ??= 0; l.band ??= "weak"; l.posted ??= l.first_seen;
    l.images ??= []; l.codes ??= []; l.flags ??= []; l.notes ??= []; l.reasons ??= [];
    l.gone ??= null; l.gone_at ??= null; l.status_if_back ??= null; l.hide_at ??= null;
    l.geo ??= null; l.locality ??= null;
  }
  return d;
}
let data = normalize(JSON.parse($("data").textContent));
let byKey = new Map();
let pending = null;                 // newer data from polling, applied on the next navigation
const photoAt = new Map();          // listing key -> photo shown on its card
const openDesc = new Set();         // listing keys with the description open
const openWhy = new Set();          // listing keys with the score breakdown open
const SORTS = {
  score: (a, b) => b.score - a.score || b.posted.localeCompare(a.posted),
  newest: (a, b) => b.posted.localeCompare(a.posted),
  cheapest: (a, b) => (a.warm ?? 1e9) - (b.warm ?? 1e9),
  largest: (a, b) => (b.size ?? 0) - (a.size ?? 0),
};
const state = { tab: "matches", picked: {}, menu: null, shown: PAGE, expandAll: prefs.get("expandAll", false),
                sort: SORTS[prefs.get("sort", "score")] ? prefs.get("sort", "score") : "score" };
const prevSeen = prefs.get("lastSeen", "");  // newest listing at the previous visit

const inArea = (l) => !l.codes.includes("area") && !l.codes.includes("avoid");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const when = (iso) => iso ? new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

function index() { byKey = new Map(data.listings.map((l) => [l.key, l])); }
function applyPending() { if (pending) { data = pending; pending = null; index(); $("banner").hidden = true; } }

// The filters above the listings, per tab: [id, label, multi, options], an option being [value, label, test].
// A one-choice filter starts on its first option; a multi-choice one lets everything through until
// something is picked, then whatever matches any of the picks. Different filters all have to match.
function filtersFor(tab, list) {
  const out = [];
  if (tab === "rejected") {
    out.push(["where", "Where", false, [["in", "In area", inArea], ["out", "Outside area", (l) => !inArea(l)],
                                        ["any", "Anywhere", () => true]]]);
    out.push(["reason", "Reason", true, Object.entries(data.reasons).filter(([c]) => c !== "area" && c !== "avoid")
      .map(([c, label]) => [c, label, (l) => l.codes.includes(c)])]);
  }
  if (tab === "hidden" && list.some((l) => l.gone)) {
    out.push(["show", "Show", false, [["all", "All", () => true], ["mine", "Hidden by you", (l) => !l.gone],
                                      ...Object.entries(GONE).map(([c, label]) => [c, label, (l) => l.gone === c])]]);
  }
  const places = new Set([...list.map((l) => l.locality).filter(Boolean), ...(picks(tab).locality || [])]);
  if (places.size > 1) {
    out.push(["locality", "Locality", true, [...places].sort((a, b) => a.localeCompare(b, "de"))
      .map((p) => [p, p, (l) => l.locality === p])]);
  }
  return out;
}
const picks = (tab) => (state.picked[tab] ??= {});
const isOn = ([id, , multi, options], p, value) => multi ? (p[id] || []).includes(value) : (p[id] ?? options[0][0]) === value;
function passes(l, f, p) {
  const [id, , multi, options] = f;
  if (multi && !(p[id] || []).length) return true;
  return options.some(([v, , test]) => isOn(f, p, v) && test(l));
}
// `list` narrowed down by every filter but `skip`.
const narrow = (list, filters, p, skip) => list.filter((l) => filters.every((f) => f === skip || passes(l, f, p)));
const filtering = (filters, p) => filters.some((f) => f[2] ? (p[f[0]] || []).length : (p[f[0]] ?? f[3][0][0]) !== f[3][0][0]);
const inTab = () => data.listings.filter(TABS.find((t) => t[0] === state.tab)[2]);

function visible() {
  const list = inTab();
  return narrow(list, filtersFor(state.tab, list), picks(state.tab)).sort(SORTS[state.sort]);
}

function renderTabs() {
  $("tabs").innerHTML = TABS.map(([id, label, test]) =>
    `<button role="tab" class="tab" aria-selected="${id === state.tab}" data-tab="${id}">${label}<span class="n">${data.listings.filter(test).length}</span></button>`
  ).join("");
}

// One dropdown per filter, showing what's picked; state.menu is the one that's open. In its menu, each
// option's count is what you'd get by picking it, with the other filters as they are. Options with
// nothing behind them are left out, unless picked (or a one-choice filter's first).
function renderFilters() {
  const list = inTab(), filters = filtersFor(state.tab, list), p = picks(state.tab);
  if (!filters.some((f) => f[0] === state.menu)) state.menu = null;
  const parts = filters.map((f) => {
    const [id, label, multi, options] = f;
    const picked = options.filter(([v]) => isOn(f, p, v));
    const value = !multi ? picked[0]?.[1] ?? "" : picked.length > 1 ? `${picked.length} picked` : picked[0]?.[1] ?? "Any";
    const changed = multi ? picked.length > 0 : picked[0]?.[0] !== options[0][0];
    const open = state.menu === id;
    let menu = "";
    if (open) {
      const rest = narrow(list, filters, p, f);
      menu = (multi ? `<button class="dd-opt" role="menuitemradio" aria-checked="${!picked.length}" data-filter="${id}" data-any>` +
                      `Any<span class="n">${rest.length}</span></button>` : "") +
        options.map(([v, text, test], i) => {
          const on = isOn(f, p, v), n = rest.filter(test).length;
          return n || on || (!multi && i === 0)
            ? `<button class="dd-opt" role="${multi ? "menuitemcheckbox" : "menuitemradio"}" aria-checked="${on}" data-filter="${id}" ` +
              `data-value="${esc(v)}">${esc(text)}<span class="n">${n}</span></button>`
            : "";
        }).join("");
      menu = `<div class="dd-menu" role="menu" aria-label="${label}">${menu}</div>`;
    }
    return `<div class="dd"><button class="dd-btn${changed ? " on" : ""}" data-menu="${id}" aria-haspopup="menu" aria-expanded="${open}">` +
           `<span class="dd-label">${label}</span><span class="dd-value">${esc(value)}</span><span class="caret">▼</span></button>${menu}</div>`;
  });
  if (filtering(filters, p)) {
    parts.push(`<span class="filter-sum">${narrow(list, filters, p).length} of ${list.length} · ` +
               `<button class="linkish" data-clear>Clear</button></span>`);
  }
  $("filters").innerHTML = parts.join("");
  $("filters").hidden = !filters.length;
  const menu = $("filters").querySelector(".dd-menu");  // keep an open menu on screen (phones)
  if (menu) {
    const over = menu.getBoundingClientRect().right - (document.documentElement.clientWidth - 8);
    if (over > 0) menu.style.left = `${-over}px`;
  }
  return filtering(filters, p);
}

// ---- mini-map: OpenStreetMap in Stadia Maps' light or dark style (to match the page), centred on the flat.
// Stadia needs no API key for pages on localhost, which it checks by the Referer: hence referrerpolicy.
const darkMode = matchMedia("(prefers-color-scheme: dark)");
const TILE = 256, MAP_W = 640, MAP_H = 128;  // tiles enough for a card up to MAP_W wide
function worldPx(lat, lon, z) {  // Web Mercator, as the tiles use
  const n = TILE * 2 ** z, s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
}
function miniMap(l) {
  const g = l.geo;
  if (!g) return "";
  const z = g.precision === "area" ? 13 : 14;
  const [px, py] = worldPx(g.lat, g.lon, z);
  const style = darkMode.matches ? "alidade_smooth_dark" : "alidade_smooth", hd = devicePixelRatio > 1 ? "@2x" : "";
  let tiles = "";
  for (let tx = Math.floor((px - MAP_W / 2) / TILE); tx <= Math.floor((px + MAP_W / 2) / TILE); tx++) {
    for (let ty = Math.floor((py - MAP_H / 2) / TILE); ty <= Math.floor((py + MAP_H / 2) / TILE); ty++) {
      tiles += `<img class="tile" alt="" loading="lazy" referrerpolicy="origin" src="https://tiles.stadiamaps.com/tiles/${style}/${z}/${tx}/${ty}${hd}.png"` +
               ` style="left:calc(50% + ${Math.round(tx * TILE - px)}px);top:calc(50% + ${Math.round(ty * TILE - py)}px)">`;
    }
  }
  const mPerPx = 156543.03 * Math.cos(g.lat * Math.PI / 180) / 2 ** z;
  const r = Math.round(Math.min(60, Math.max(18, (g.radius || 500) / mPerPx)));
  const mark = g.precision === "area" ? `<span class="zone" style="width:${2 * r}px;height:${2 * r}px"></span>` : `<span class="pin"></span>`;
  return `<div class="minimap">${tiles}${mark}` +
    `<a class="open" href="https://www.google.com/maps/search/?api=1&amp;query=${g.lat},${g.lon}" target="_blank" rel="noopener" ` +
    `aria-label="Open the location in Google Maps"></a>` +
    `<a class="credit" href="https://stadiamaps.com/attribution/" target="_blank" rel="noopener">© Stadia Maps © OpenMapTiles © OpenStreetMap</a></div>`;
}
// The neighbourhood, leading the meta line; its map is only built the first time it's wanted (see fillMap),
// so tiles load on demand.
function where(l) {
  const label = l.locality || (l.geo ? "On the map" : "");
  if (!label) return "";
  if (!l.geo) return `<span class="loc">📍 ${esc(label)}</span> · `;
  const how = { street: " (street known, not the number)", area: " (roughly: only the postcode is known)" }[l.geo.precision] || "";
  return `<span class="loc"><button class="loc-btn" data-act="map" aria-expanded="false" title="Show on the map${how}">📍 ${esc(label)}</button>` +
         `<span class="map-pop"></span></span> · `;
}

// Short forms of what rules.py writes out in full for the console and push notifications; the full text shows on hover.
const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
const tidy = (t) => t.replace(/\s*\((?![^)]*€)[^)]*\)/g, "");  // explanations in brackets; amounts in € stay
function shortNote(t) {
  const plus = t.match(/^ImmoScout Plus members only until (\d{4}-\d\d-\d\d)/);
  if (plus) return plus[1] < new Date().toISOString().slice(0, 10) ? null : `Plus members only until ${day(plus[1])}`;
  const est = t.match(/^warm rent estimated from cold rent \(~(.+?)\)/);
  if (est) return `warm ≈ ${est[1]} (estimated)`;
  if (t.startsWith("warm rent taken from")) return "warm rent from the text";
  if (t.startsWith("Nachmieter ad")) return "Nachmieter";
  if (t.startsWith("same rent/size/postcode as")) return "repost";
  return tidy(t);
}
const chip = (cls, text, full) => text ? `<span class="chip${cls}" title="${esc(full)}">${esc(text)}</span>` : "";
// "sublet: the lease would be with ..." -> "sublet"; a scam's signs are on its own chips
const shortReason = (r) => tidy(r).replace(/^(sublet|looks like a scam): .*/, "$1");
function fillMap(btn) {
  const pop = btn.nextElementSibling, l = byKey.get(btn.closest(".card")?.dataset.key);
  if (pop && l && !pop.firstChild) pop.innerHTML = miniMap(l);
}

function card(l) {
  const n = l.images.length;
  const i = Math.min(photoAt.get(l.key) || 0, Math.max(n - 1, 0));
  const media = n
    ? `<img class="photo" src="${esc(l.images[i])}" alt="Photo ${i + 1} of ${n}" loading="lazy" decoding="async" data-act="zoom">` +
      (n > 1 ? `<button class="nav prev" data-act="prev" aria-label="Previous photo">‹</button>` +
               `<button class="nav next" data-act="next" aria-label="Next photo">›</button>` : "") +
      `<span class="counter">${n > 1 ? `${i + 1} / ${n}` : "1 photo"}</span>`
    : `<div class="nophoto">No photos</div>`;
  const saved = l.status === "saved";
  const gone = l.gone ? GONE[l.gone] || "Offline" : "";
  const fav = data.highlight.includes(l.source);
  const badges = (prevSeen && l.first_seen > prevSeen ? `<span class="badge new">new</span>` : "") +
                 (fav ? `<span class="badge fav">${esc(SOURCES[l.source] || l.source)}</span>` : "") +
                 (saved ? `<span class="badge">★ Saved</span>` : "") +
                 (gone ? `<span class="badge gone" title="Ad ${esc(gone.toLowerCase())}, noticed ${esc(when(l.gone_at))}. ` +
                         `Moves back by itself if it comes online again.">${esc(gone)} ${esc(day(l.gone_at))}</span>` : "") +
                 (gone && l.status === "hidden" && l.status_if_back === "saved" ? `<span class="badge">★ Was saved</span>` : "");
  const chips = [...l.flags.map((f) => chip(" warn", "⚠ " + tidy(f), f)),
                 ...l.notes.map((t) => chip("", shortNote(t), t))].join("");
  const open = state.expandAll || openDesc.has(l.key);
  const whyOpen = openWhy.has(l.key);
  const whyList = l.why.map(([p, t]) =>
    `<li><span class="pts ${p > 0 ? "plus" : p < 0 ? "minus" : "zero"}">${p > 0 ? "+" : ""}${p}</span>${esc(t)}</li>`).join("");
  const toggles = `<div class="toggles">` +
    (l.description ? `<button class="desc-toggle" data-act="desc" aria-expanded="${open}">${open ? "Hide description" : "Show description"}</button>` : "") +
    `<button class="desc-toggle" data-act="why" aria-expanded="${whyOpen}">Why ${l.score}?</button></div>`;
  const desc = toggles +
    `<ul class="why"${whyOpen ? "" : " hidden"}>${whyList}</ul>` +
    (l.description ? `<div class="desc"${open ? "" : " hidden"}>${esc(l.description)}</div>`
                   : `<p class="desc-none">No description here${l.source === "inberlinwohnen" ? "; the landlord's page has the details" : ""}.</p>`);
  return `<article class="card${l.ok ? "" : " rejected"}${gone ? " gone" : ""}${fav ? " fav" : ""}" data-key="${esc(l.key)}">
    <div class="media">${media}<div class="badges">${badges}</div>
      <span class="score ${l.band}" title="Score ${l.score}/100 (${l.band})">${l.score}</span></div>
    <div class="body">
      <div class="price">${esc(l.headline)}</div>
      <a class="title" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || l.url)}</a>
      <div class="meta">${where(l)}<span title="${esc(l.landlord || "")}">${esc(l.source)}</span> · seen ${esc(when(l.first_seen))}</div>
      ${gone && saved && l.hide_at ? `<p class="offline">⊘ Offline: moves to Hidden ${esc(when(l.hide_at))}</p>` : ""}
      ${l.ok ? "" : `<p class="reasons" title="${esc(l.reasons.join("; "))}">✗ ${esc(l.reasons.map(shortReason).join(" · "))}</p>`}
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${desc}
      <div class="actions">
        <button class="btn${saved ? " on" : ""}" data-act="save" aria-pressed="${saved}">${saved ? "★ Saved" : "☆ Save"}</button>
        <button class="btn" data-act="hide">${l.status === "hidden" ? "Unhide" : "Hide"}</button>
        <a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>
  </article>`;
}

function render() {
  renderTabs();
  const filtered = renderFilters();
  const list = visible();
  $("grid").innerHTML = list.slice(0, state.shown).map(card).join("");
  $("more").hidden = list.length <= state.shown;
  $("more").textContent = `Show more (${list.length - state.shown} left)`;
  $("empty").hidden = list.length > 0;
  $("empty").textContent = filtered ? "Nothing here with these filters." : EMPTY[state.tab];
  $("toggle-desc").textContent = state.expandAll ? "Collapse descriptions" : "Expand descriptions";
  $("toggle-desc").setAttribute("aria-pressed", String(state.expandAll));
  $("sub").textContent = data.subtitle;
}

// ---- photos on the card
function step(l, d, cardEl) {
  const n = l.images.length;
  if (n < 2) return;
  const i = ((photoAt.get(l.key) || 0) + d + n) % n;
  photoAt.set(l.key, i);
  const img = cardEl.querySelector(".photo");
  img.src = l.images[i];
  img.alt = `Photo ${i + 1} of ${n}`;
  cardEl.querySelector(".counter").textContent = `${i + 1} / ${n}`;
  new Image().src = l.images[(i + d + n) % n];  // preload the next one in this direction
}

// ---- full-screen viewer
const lb = { l: null, i: 0, returnTo: null };
function openViewer(l, i) {
  if (!l.images.length) return;
  Object.assign(lb, { l, i, returnTo: document.activeElement });
  $("lb-thumbs").innerHTML = l.images.length > 1
    ? l.images.map((u, k) => `<button class="lb-thumb" data-i="${k}" aria-label="Photo ${k + 1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join("")
    : "";
  $("lb").hidden = false;
  document.body.classList.add("noscroll");
  showViewer();
  $("lb-close").focus();
}
function showViewer() {
  const { l, i } = lb, n = l.images.length;
  $("lb-img").src = l.images[i];
  $("lb-img").alt = `Photo ${i + 1} of ${n}`;
  $("lb-cap").textContent = `${l.headline}  ·  ${i + 1} / ${n}`;
  $("lb-prev").hidden = $("lb-next").hidden = n < 2;
  document.querySelectorAll(".lb-thumb").forEach((t, k) => t.setAttribute("aria-current", String(k === i)));
  document.querySelector('.lb-thumb[aria-current="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
  if (n > 1) new Image().src = l.images[(i + 1) % n];
}
function viewerStep(d) { const n = lb.l.images.length; lb.i = (lb.i + d + n) % n; showViewer(); }
function closeViewer() {
  const { l, i } = lb;
  $("lb").hidden = true;
  document.body.classList.remove("noscroll");
  photoAt.set(l.key, i);  // the card continues where the viewer stopped
  const c = document.querySelector(`.card[data-key="${CSS.escape(l.key)}"]`);
  if (c?.querySelector(".photo")) {
    c.querySelector(".photo").src = l.images[i];
    if (l.images.length > 1) c.querySelector(".counter").textContent = `${i + 1} / ${l.images.length}`;
  }
  lb.returnTo?.focus();
  lb.l = null;
}

// ---- save / hide
let toastTimer;
function toast(text, undo) {
  $("toast-text").textContent = text;
  $("toast-undo").hidden = !undo;
  $("toast-undo").onclick = undo ? () => { $("toast").hidden = true; undo(); } : null;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 6000);
}
const editedAt = new Map();  // listing key -> when its last Save/Hide reached the server (Infinity until then)
async function setStatus(l, status) {
  const before = { status: l.status, hide_at: l.hide_at };
  const later = pending?.listings.find((x) => x.key === l.key);  // the same listing in data not shown yet
  for (const x of [l, later]) if (x) Object.assign(x, { status, hide_at: null });
  editedAt.set(l.key, Infinity);
  render();
  if (status === "hidden") toast("Hidden.", () => setStatus(l, before.status));
  else if (status === "saved") toast("Saved. It's on the Saved tab now.", () => setStatus(l, before.status));
  try {
    const r = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ key: l.key, status }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    editedAt.set(l.key, Date.now());
  } catch {
    for (const x of [l, later]) if (x) Object.assign(x, before);
    editedAt.delete(l.key);
    render();
    toast("Couldn't save that. Is homefind still running?");
  }
}

// ---- tab alert: new matches that arrive while you're elsewhere put a count in the
// tab title and a dot on its icon, until you come back to the tab. Nothing else.
const TITLE = document.title;
const unseen = new Set();  // keys of new matches since you last looked
const icon = (dot) => "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1f6f5c"/>' +
  '<path d="M16 6 4 16h3.5v10h6.5v-7h4v7h6.5V16H28z" fill="#fff"/>' +
  (dot ? '<circle cx="25" cy="7" r="6.5" fill="#e5484d" stroke="#fff" stroke-width="2"/>' : "") + "</svg>");
const looking = () => !document.hidden && document.hasFocus();
// Same as what gets pushed to your phone: a match that isn't a repost of one you've seen.
const alertWorthy = (l) => l.ok && !l.notes.some((t) => t.startsWith("same rent/size/postcode"));
function markTab() {
  const n = unseen.size;
  document.title = n ? `(${n}) New match${n > 1 ? "es" : ""} · ${TITLE}` : TITLE;
  $("favicon").href = icon(n > 0);
}
function clearTab() { if (unseen.size && looking()) { unseen.clear(); markTab(); } }
addEventListener("focus", clearTab);
document.addEventListener("visibilitychange", clearTab);

// ---- live updates: new listings appear on their own while the page is open
const atTop = () => $("lb").hidden && scrollY < 300;
function showPending() {
  if (!pending) return;
  const fresh = pending.listings.filter((l) => !byKey.has(l.key));
  if (atTop()) {  // nothing to lose: update in place
    applyPending();
    render();
    return;
  }
  const matches = fresh.filter((l) => l.ok).length;
  if (matches) {  // don't move the page under the reader; offer it instead
    $("banner-text").textContent = `${matches} new match${matches > 1 ? "es" : ""}`;
    $("banner").hidden = false;
  }
}
async function poll() {
  try {
    const asked = Date.now();
    const r = await fetch("/api/listings", { cache: "no-store" });
    if (!r.ok) return;
    const next = normalize(await r.json());
    data.subtitle = next.subtitle;
    $("sub").textContent = next.subtitle;
    // The server's word counts (ads taken offline or back, saved ones moving to Hidden, rejected
    // ones deleted), except for a Save/Hide made here that hadn't reached it when it answered.
    for (const l of next.listings) {
      const cur = byKey.get(l.key);
      if (cur && (editedAt.get(l.key) ?? 0) >= asked) Object.assign(l, { status: cur.status, hide_at: cur.hide_at });
    }
    const fresh = next.listings.filter((l) => !byKey.has(l.key));
    const keys = new Set(next.listings.map((l) => l.key));
    const changed = data.listings.some((l) => !keys.has(l.key)) || next.listings.some((l) => {
      const cur = byKey.get(l.key);
      return cur && (cur.status !== l.status || cur.gone !== l.gone || cur.hide_at !== l.hide_at ||
                     cur.locality !== l.locality || cur.geo?.lat !== l.geo?.lat || cur.geo?.lon !== l.geo?.lon);
    });
    if (!fresh.length && !changed) return;
    if (!looking()) {
      for (const l of fresh.filter(alertWorthy)) unseen.add(l.key);
      markTab();
    }
    pending = next;
    showPending();
  } catch { /* homefind isn't running right now; try again later */ }
}
addEventListener("scroll", () => { if (pending && atTop()) showPending(); }, { passive: true });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// ---- events
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  applyPending();
  Object.assign(state, { tab: b.dataset.tab, shown: PAGE, menu: null });
  history.replaceState(null, "", "#" + state.tab);  // so a tab can be bookmarked, e.g. /#saved
  render();
});
// Picking in a one-choice menu closes it; a multi-choice one stays open to pick more.
$("filters").addEventListener("click", (e) => {
  const toggle = e.target.closest("[data-menu]");
  if (toggle) {
    state.menu = state.menu === toggle.dataset.menu ? null : toggle.dataset.menu;
    renderFilters();
    return;
  }
  const b = e.target.closest("[data-filter], [data-clear]");
  if (!b) return;
  applyPending();
  const p = picks(state.tab);
  if (b.matches("[data-clear]")) {
    state.picked[state.tab] = {};
    state.menu = null;
  } else {
    const { filter: id, value } = b.dataset;
    const f = filtersFor(state.tab, inTab()).find((x) => x[0] === id);
    if (!f) return;
    if (b.matches("[data-any]")) {
      p[id] = [];
      state.menu = null;
    } else if (f[2]) {
      p[id] = isOn(f, p, value) ? p[id].filter((v) => v !== value) : [...(p[id] || []), value];
    } else {
      p[id] = value === f[3][0][0] ? undefined : value;
      state.menu = null;
    }
  }
  state.shown = PAGE;
  render();
});
function closeMenu() { if (state.menu) { state.menu = null; renderFilters(); } }
darkMode.addEventListener("change", render);
$("more").addEventListener("click", () => { state.shown += PAGE; render(); });
$("sort").value = state.sort;
$("sort").addEventListener("change", () => {
  state.sort = $("sort").value;
  prefs.set("sort", state.sort);
  state.shown = PAGE;
  render();
});
$("toggle-desc").addEventListener("click", () => {
  state.expandAll = !state.expandAll;
  openDesc.clear();
  prefs.set("expandAll", state.expandAll);
  render();
});
$("banner-show").addEventListener("click", () => { applyPending(); Object.assign(state, { tab: "matches", shown: PAGE }); render(); scrollTo(0, 0); });
$("grid").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const cardEl = el.closest(".card");
  const l = byKey.get(cardEl.dataset.key);
  if (!l) return;
  const act = el.dataset.act;
  if (act === "prev" || act === "next") step(l, act === "next" ? 1 : -1, cardEl);
  else if (act === "zoom") openViewer(l, photoAt.get(l.key) || 0);
  else if (act === "save") setStatus(l, l.status === "saved" ? null : "saved");
  else if (act === "hide") setStatus(l, l.status === "hidden" ? null : "hidden");
  else if (act === "map") {  // keeps the map up without hovering: for touch screens, and to reach its link with the keyboard
    fillMap(el);
    const open = el.parentElement.classList.toggle("open");
    el.setAttribute("aria-expanded", String(open));
  } else if (act === "desc") {
    const box = cardEl.querySelector(".desc");
    const open = box.hidden;
    box.hidden = !open;
    el.setAttribute("aria-expanded", String(open));
    el.textContent = open ? "Hide description" : "Show description";
    if (open) openDesc.add(l.key); else openDesc.delete(l.key);
  } else if (act === "why") {
    const box = cardEl.querySelector(".why");
    box.hidden = !box.hidden;
    el.setAttribute("aria-expanded", String(!box.hidden));
    if (box.hidden) openWhy.delete(l.key); else openWhy.add(l.key);
  }
});
for (const type of ["mouseover", "focusin"]) {
  $("grid").addEventListener(type, (e) => { const b = e.target.closest?.(".loc-btn"); if (b) fillMap(b); });
}
function closeMaps(except) {
  for (const loc of document.querySelectorAll(".loc.open")) {
    if (loc.contains(except)) continue;
    loc.classList.remove("open");
    loc.querySelector(".loc-btn").setAttribute("aria-expanded", "false");
  }
}
document.addEventListener("click", (e) => {  // a click elsewhere puts an open map or filter menu away
  closeMaps(e.target);
  if (!e.target.closest(".dd")) closeMenu();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMaps(null); closeMenu(); } });
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.classList.contains("tile")) img.style.visibility = "hidden";  // a gap in the map, not a "Photo unavailable"
  else if (!img.src.startsWith("data:")) img.src = BROKEN;
}, true);
$("lb-close").addEventListener("click", closeViewer);
$("lb-prev").addEventListener("click", () => viewerStep(-1));
$("lb-next").addEventListener("click", () => viewerStep(1));
$("lb").addEventListener("click", (e) => {
  const t = e.target.closest(".lb-thumb");
  if (t) { lb.i = Number(t.dataset.i); showViewer(); }
  else if (e.target === $("lb") || e.target === $("lb-fig")) closeViewer();
});
document.addEventListener("keydown", (e) => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight") viewerStep(1);
  else if (e.key === "ArrowLeft") viewerStep(-1);
});
let touchX = null;
$("lb").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 40) viewerStep(dx < 0 ? 1 : -1);
});

const fromHash = location.hash.slice(1);
if (TABS.some((t) => t[0] === fromHash)) state.tab = fromHash;
index();
render();
markTab();
prefs.set("lastSeen", data.listings.reduce((m, l) => (l.first_seen > m ? l.first_seen : m), ""));
setInterval(poll, 60000);
</script>
</body>
